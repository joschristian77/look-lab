<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Look Lab</title>
<meta name="description" content="Give your photos a film look. Pick from 17 looks, compare, fine-tune and save full-size JPGs. Photos never leave your phone.">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Look Lab">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Film darkroom: neutral (hue-free) greys so colour reads true; the photo sits in a black well with a film-rebate edge print; one safelight amber accent */
:root{
  --bg:#151515; --surface:#1c1c1c; --raise:#272727; --line:#323232; --well:#0b0b0b;
  --fg:#ededeb; --muted:#a6a6a3; --accent:#e8a54b; --accent-ink:#1b1206;
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:4px; --r-m:7px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.ready-actions{display:flex;flex-wrap:wrap;gap:8px}
.ready-actions .btn{flex:1}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,label{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);column-gap:24px;height:100%}

/* header */
.bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.wordmark{font-size:21px;font-weight:800;font-stretch:125%;letter-spacing:-.01em;white-space:nowrap}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:var(--r-m);min-height:40px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:#4d4d4d}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#f0b25d}
.btn:disabled{opacity:.5;cursor:progress}
.btn.quiet{background:transparent;min-height:36px;padding:0 12px;font-weight:500}
.btn.quiet[aria-pressed="true"]{background:var(--raise);border-color:#5a5a5a}

/* stage */
.stage{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0;padding-block:18px}
.frame{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--well);border-radius:var(--r-s)}
.view{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.view.split{cursor:ew-resize}
.view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tag{position:absolute;top:12px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:var(--r-s);pointer-events:none}
.handle{position:absolute;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.knob{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--mono);font-size:13px;box-shadow:0 1px 8px rgba(0,0,0,.45);cursor:ew-resize}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,11,11,.72);font-weight:600;font-size:15px}
/* film rebate edge print: the identity motif, mimics the amber markings printed along a film's edge */
.rebate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 12px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);opacity:.85;white-space:nowrap;overflow:hidden}
.rebate span{overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.hint{color:var(--muted);font-size:13px}
.link{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;min-height:36px}
.link input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* contact strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:0 0 auto;display:flex;flex-direction:column;gap:4px;width:84px;cursor:pointer;border-radius:var(--r-s)}
.thumb .pic{position:relative;width:84px;height:64px;border-radius:var(--r-s);overflow:hidden;background:var(--raise);outline:2px solid transparent;outline-offset:-2px}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on .pic{outline-color:var(--accent)}
.thumb .no{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.thumb.on .no{color:var(--fg)}
.x{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.72);font-size:15px;line-height:1;padding:0;cursor:pointer}
.add{flex:0 0 auto;width:84px;height:64px;display:grid;place-items:center;border:1px dashed #4a4a4a;border-radius:var(--r-s);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.add:hover{color:var(--fg);border-color:var(--muted)}

/* rail */
.panel{min-height:0;display:flex;flex-direction:column;padding-block:18px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border-radius:var(--r-m)}
.tab{appearance:none;border:0;background:transparent;border-radius:5px;min-height:36px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--raise);color:var(--fg)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:18px 2px 32px;display:flex;flex-direction:column;gap:18px}
.fam{margin:0;font-size:13px;font-weight:700;font-stretch:112%;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fam small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.famblock{display:flex;flex-direction:column;gap:10px}
.lookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lookwrap{position:relative;min-width:0}
.look{appearance:none;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;border-radius:var(--r-s)}
.look canvas{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-s);display:block;background:var(--raise);outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s}
.look:hover canvas{outline-color:#555}
.look span{font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look.on canvas{outline-color:var(--accent)}
.look.on span{color:var(--fg);font-weight:600}
.pin{position:absolute;top:4px;right:4px;width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;opacity:.6;cursor:pointer;padding:0;transition:opacity .15s}
.lookwrap:hover .pin,.pin:focus-visible{opacity:1}
.pin.on{opacity:1;color:var(--accent)}
.current{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border-radius:var(--r-m)}
.current h2{margin:0;font-size:16px;font-weight:700;font-stretch:112%}
.current p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

details{border-top:1px solid var(--line);padding-top:14px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;font-stretch:112%;min-height:28px}
summary::-webkit-details-marker{display:none}
summary .n{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--accent)}
summary::after{content:"+";font-family:var(--mono);font-weight:400;font-size:15px;color:var(--muted);margin-left:10px}
details[open] summary::after{content:"\2212"}
summary .sp{flex:1}
.sliders{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:0 10px}
.sl label{font-size:13.5px;color:var(--muted)}
.sl output{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-width:44px;justify-content:flex-end}
.sl output i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sl .rs{appearance:none;border:0;background:none;padding:0 2px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;visibility:hidden}
.sl.changed .rs{visibility:visible}
.sl input{grid-column:1/-1}
.sl.changed label,.sl.changed output{color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;--track:linear-gradient(90deg,#3a3a3a,#3a3a3a)}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,165,75,.35)}
input[type=range]:focus-visible::-moz-range-thumb{border-color:var(--accent)}
.textbtn{align-self:flex-start;appearance:none;background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.textbtn:hover{color:var(--fg)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#111;padding:10px 16px;border-radius:var(--r-m);font-weight:600;max-width:calc(100% - 32px);z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.drop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(11,11,11,.88);border:2px dashed var(--accent);font-size:18px;font-weight:700}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;max-width:min(720px,calc(100% - 32px));max-height:85vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h2{margin:0 0 6px;font-size:17px;font-stretch:112%}
dialog p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.outs img{width:100%;border-radius:var(--r-s);display:block}

@media (max-width:820px){
  html,body{height:auto}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .app{display:block}
  .bar{padding-block:12px}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .actions .btn{flex:1;min-height:46px}
  .stage{padding-block:14px 0}
  .frame{flex:none}
  .view{flex:none;width:100%;aspect-ratio:var(--ar,3/2);max-height:62vh}
  .panel{padding-block:20px 0}
  .pane{overflow:visible;padding-bottom:12px}
  .lookgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .hint{display:none}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="wordmark">Look Lab</span><span id="count" class="meta"></span></div>
    <div class="actions">
      <button id="addBtn" class="btn" type="button">Add photos</button>
      <button id="saveAll" class="btn" type="button" hidden>Save all</button>
      <button id="saveOne" class="btn primary" type="button">Save photo</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </header>

  <main class="stage">
    <div class="frame">
      <div class="view" id="view" aria-label="Photo preview">
        <canvas id="preview"></canvas>
        <span id="tagL" class="tag" style="left:12px" hidden>Original</span>
        <span id="tagR" class="tag" style="right:12px" hidden></span>
        <div id="handle" class="handle" hidden></div>
        <div id="knob" class="knob" role="slider" tabindex="0" aria-label="Split position" aria-valuemin="0" aria-valuemax="100" hidden>&#8596;</div>
        <div id="busy" class="busy" role="status" hidden></div>
      </div>
      <div class="rebate" aria-hidden="true"><span id="edgeL"></span><span id="edgeR"></span></div>
    </div>
    <div class="tools">
      <button id="splitBtn" class="btn quiet" type="button" aria-pressed="false">Split view</button>
      <label class="link" id="linkRow"><input type="checkbox" id="linked" checked> Same edit on every photo</label>
      <span class="hint" id="hint">Press and hold the photo to see the original.</span>
    </div>
    <div class="strip" id="strip" aria-label="Your photos"></div>
  </main>

  <aside class="panel">
    <div class="tabs" role="tablist" aria-label="Editing">
      <button class="tab" role="tab" id="tab-looks" aria-controls="pane-looks" aria-selected="true" type="button">Looks</button>
      <button class="tab" role="tab" id="tab-adjust" aria-controls="pane-adjust" aria-selected="false" tabindex="-1" type="button">Adjust</button>
    </div>
    <section class="pane" id="pane-looks" role="tabpanel" aria-labelledby="tab-looks">
      <div class="current">
        <h2 id="lookName"></h2>
        <p id="lookNote"></p>
        <div class="sliders" id="strengthBox"></div>
      </div>
      <div id="looks" class="famblock" style="gap:22px"></div>
    </section>
    <section class="pane" id="pane-adjust" role="tabpanel" aria-labelledby="tab-adjust" hidden>
      <div id="groups" style="display:flex;flex-direction:column;gap:14px"></div>
      <button class="textbtn" id="reset" type="button">Reset all adjustments</button>
    </section>
  </aside>
</div>
<div id="drop" class="drop" hidden>Drop photos to add them</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="ready" aria-labelledby="readyTitle">
  <h2 id="readyTitle"></h2>
  <p id="readyNote"></p>
  <div class="outs" id="outs"></div>
  <div class="ready-actions">
    <button class="btn primary" id="readySave" type="button"></button>
    <button class="btn" id="readyClose" type="button">Close</button>
  </div>
</dialog>

/* ---------- grading engine ---------- */
const N=16384,LINMAX=4;

function toneLUT(p){

}

function blurPass(s,d,w,h,r,horiz){

    for(let k=0;k<len;k++){

const makeCanvas=(w,h)=>{if(typeof document!=='undefined'){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}return new OffscreenCanvas(w,h);};

  const img=x.getImageData(0,0,w,h),data=img.data,L=new Float32Array(w*h);

    const sx=rnd()*1500;x.beginPath();x.moveTo(sx,y);x.lineTo(sx+len,y);x.stroke();}

  g=x.createLinearGradient(0,770,0,1000);g.addColorStop(0,'#e6cfa6');g.addColorStop(1,'#b48f66');
  x.fillStyle=g;x.beginPath();x.moveTo(0,785);for(let px=0;px<=1500;px+=30)x.lineTo(px,782+Math.sin(px/70)*6);x.lineTo(1500,1000);x.lineTo(0,1000);x.fill();
  x.fillStyle='#1d2a22';

/* ---------- sliders ---------- */
const SL={};
function fmt(k,v){

  if(FIXED.has(k))return Math.round(v)+'°';
  const r=Math.round(v);return(r>0&&!/Amt|fade|grain/.test(k)?'+':'')+(r<0?'−'+(-r):r);
}
function buildSliders(){
  const mk=(host,[k,label,min=-100,max=100,step=1,track])=>{
    const row=document.createElement('div');row.className='sl';
    row.innerHTML=`<label for="s-${k}">${label}</label><button type="button" class="rs" aria-label="Reset ${label}">Reset</button><output id="o-${k}" for="s-${k}"></output><input type="range" id="s-${k}" min="${min}" max="${max}" step="${step}">`;
    const inp=row.querySelector('input'),out=row.querySelector('output');
    if(track)inp.style.setProperty('--track',track);
    const reset=()=>{onSlider(k,k==='strength'?100:null);refreshStrip();};
    inp.addEventListener('input',()=>onSlider(k,+inp.value));
    inp.addEventListener('change',()=>refreshStrip());
    row.querySelector('.rs').addEventListener('click',reset);
    inp.addEventListener('dblclick',reset);
    SL[k]={row,inp,out};host.appendChild(row);
  };
  mk($('strengthBox'),['strength','Look strength',0,150,1]);
  GROUPS.forEach(gp=>{
    const d=document.createElement('details');if(gp.open)d.open=true;
    d.innerHTML=`<summary><span>${gp.name}</span><span class="sp"></span><span class="n"></span></summary><div class="sliders"></div>`;
    gp.items.forEach(it=>mk(d.querySelector('.sliders'),it));
    gp.el=d.querySelector('.n');$('groups').appendChild(d);
  });
}
function onSlider(k,v){
  if(k==='strength'){mutate(p=>p.strength=v??100);}
  else{
    mutate(p=>{
      if(v===null){delete p.adj[k];return;}
      const P=LOOK[p.look].p,base=P[k]??DEF[k],s=FIXED.has(k)?1:p.strength/100;
      const a=v-(DEF[k]+(base-DEF[k])*s);

    });
  }

}
function syncSliders(){
  const p=ph(),e=eff(p);

  SL.strength.row.classList.toggle('changed',p.strength!==100);
  SL.strength.row.hidden=p.look==='original';
  for(const k in DEF){
    const s=SL[k],v=e[k];s.inp.value=v;s.out.textContent='';
    if(FIXED.has(k)){const i=document.createElement('i'),tv=tintVec(v);i.style.background=`rgb(${(tv[0]+.5)*255|0},${(tv[1]+.5)*255|0},${(tv[2]+.5)*255|0})`;s.out.appendChild(i);}
    s.out.append(fmt(k,v));
    s.row.classList.toggle('changed',k in p.adj);
  }
  GROUPS.forEach(gp=>{const n=gp.items.filter(([k])=>k in p.adj).length;gp.el.textContent=n?`${n} changed`:'';});
}

let raf=0,comparing=false,splitOn=false,splitX=.5;

function draw(){
  const p=ph(),c=$('preview'),d=p.prev;
  $('view').style.setProperty('--ar',`${d.w}/${d.h}`);
  if(comparing){if(c.width!==d.w||c.height!==d.h){c.width=d.w;c.height=d.h;}c.getContext('2d').putImageData(d.img,0,0);}
  else{paint(c,d,eff(p));if(splitOn){const sx=Math.round(splitX*d.w);if(sx>0)c.getContext('2d').putImageData(d.img,0,0,0,0,sx,d.h);}}
  $('tagL').hidden=!(comparing||splitOn);
  $('tagR').hidden=!splitOn||comparing;$('tagR').textContent=LOOK[p.look].name;
  placeHandle();
  $('edgeL').textContent=`${frameNo(cur)}  ▸  ${LOOK[p.look].name.toUpperCase()}${p.look!=='original'?'  '+p.strength+'%':''}`;
  $('edgeR').textContent=`${p.w}×${p.h}  ▸  ${p.sample?'SAMPLE':'LOOK LAB'}`;
}
function contentRect(){
  const v=$('view'),d=ph().prev,cw=v.clientWidth,ch=v.clientHeight,s=Math.min(cw/d.w,ch/d.h);

}
function placeHandle(){
  const show=splitOn&&!comparing;$('handle').hidden=!show;$('knob').hidden=!show;
  $('view').classList.toggle('split',splitOn);
  if(!show)return;
  const r=contentRect(),x=r.x+splitX*r.w;
  Object.assign($('handle').style,{left:x+'px',top:r.y+'px',height:r.h+'px'});
  Object.assign($('knob').style,{left:x+'px',top:(r.y+r.h/2)+'px'});
  $('knob').setAttribute('aria-valuenow',Math.round(splitX*100));
  $('knob').setAttribute('aria-valuetext',`${Math.round(splitX*100)}% original`);
}
new ResizeObserver(placeHandle).observe($('view'));
function setSplit(on){splitOn=on;$('splitBtn').setAttribute('aria-pressed',on);$('hint').textContent=on?'Drag across the photo to move the split.':'Press and hold the photo to see the original.';draw();}
$('splitBtn').addEventListener('click',()=>setSplit(!splitOn));
const view=$('view');
let dragging=false;
const moveSplit=e=>{const r=contentRect(),b=view.getBoundingClientRect();splitX=Math.min(1,Math.max(0,(e.clientX-b.left-r.x)/r.w));schedule();};
view.addEventListener('pointerdown',e=>{
  if(e.button>0)return;view.setPointerCapture(e.pointerId);

});

  const step=e.shiftKey?.1:.02;

    const host=document.createElement('div');host.className='lookgrid';blk.appendChild(host);
    list.forEach(l=>{
      const wrap=document.createElement('div');wrap.className='lookwrap';
      const b=document.createElement('button');b.type='button';b.className='look';b.dataset.id=l.id;
      b.innerHTML=`<canvas></canvas><span></span>`;b.querySelector('span').textContent=l.name;
      b.addEventListener('click',()=>{mutate(p=>p.look=l.id);updateLookUI();syncSliders();schedule();refreshStrip();});
      wrap.appendChild(b);
      if(l.id!=='original'){
        const on=pins.includes(l.id),pn=document.createElement('button');
        pn.type='button';pn.className='pin'+(on?' on':'');pn.innerHTML=PIN_SVG;
        pn.setAttribute('aria-label',(on?'Unpin ':'Pin ')+l.name);pn.setAttribute('aria-pressed',on);pn.title=on?'Unpin':'Pin to top';
        pn.addEventListener('click',()=>{pins=on?pins.filter(x=>x!==l.id):[...pins,l.id];savePins();buildLooks();renderLookTiles();updateLookUI();toast(on?`Unpinned ${l.name}`:`Pinned ${l.name}`);});
        wrap.appendChild(pn);
      }
      host.appendChild(wrap);
    });
    root.appendChild(blk);
  };
  section('Pinned',pins.map(id=>LOOK[id]).filter(Boolean),'your favourites');
  FAMS.forEach(([fid,fname])=>{const l=LOOKS.filter(x=>x.fam===fid&&!pins.includes(x.id));section(fname,l,String(l.length).padStart(2,'0'));});
}
function renderLookTiles(){const p=ph();document.querySelectorAll('.look').forEach(b=>paint(b.querySelector('canvas'),p.thumb,eff(p,b.dataset.id,1,{})));}
function updateLookUI(){
  const p=ph();
  document.querySelectorAll('.look').forEach(b=>{const on=b.dataset.id===p.look;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  $('lookName').textContent=LOOK[p.look].name;$('lookNote').textContent=LOOK[p.look].note;
}

/* ---------- contact strip ---------- */
function refreshStrip(){
  const host=$('strip');host.innerHTML='';
  photos.forEach((q,i)=>{
    const b=document.createElement('div');b.className='thumb'+(i===cur?' on':'');b.tabIndex=0;b.setAttribute('role','button');
    b.setAttribute('aria-label',`Edit ${q.name}`);if(i===cur)b.setAttribute('aria-current','true');
    const pic=document.createElement('div');pic.className='pic';const c=document.createElement('canvas');pic.appendChild(c);b.appendChild(pic);paint(c,q.thumb,eff(q));
    const no=document.createElement('span');no.className='no';no.textContent=q.sample?`${frameNo(i)} SAMPLE`:`${frameNo(i)} ${LOOK[q.look].name.toUpperCase()}`;b.appendChild(no);
    if(!q.sample){const x=document.createElement('button');x.className='x';x.type='button';x.textContent='×';x.setAttribute('aria-label',`Remove ${q.name}`);
      x.addEventListener('click',e=>{e.stopPropagation();removePhoto(i);});pic.appendChild(x);}
    const go=()=>select(i);b.addEventListener('click',go);b.addEventListener('keydown',e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go();}});
    host.appendChild(b);
  });
  const a=document.createElement('button');a.type='button';a.className='add';a.textContent='+ Add';a.setAttribute('aria-label','Add photos');a.addEventListener('click',()=>$('file').click());host.appendChild(a);
  const real=photos.filter(q=>!q.sample).length;
  $('count').textContent=real?`${real} photo${real>1?'s':''}`:'Sample photo. Add your own to start.';
  $('saveAll').hidden=real<2;$('saveAll').textContent=`Save all ${real}`;
  $('saveOne').textContent=real>1?'Save this one':'Save photo';
  $('linkRow').hidden=photos.length<2;
}
function select(i){cur=i;updateLookUI();syncSliders();renderLookTiles();refreshStrip();draw();prefetch();}
function removePhoto(i){
  photos.splice(i,1);
  if(!photos.length)photos.push(newPhoto('Sample beach',null,SAMPLE,1500,1000,true));
  select(Math.min(cur,photos.length-1));
}

/* ---------- tabs ---------- */
const TABS=['looks','adjust'];
function showTab(id,focus){
  TABS.forEach(t=>{const on=t===id,b=$('tab-'+t);b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$('pane-'+t).hidden=!on;if(on&&focus)b.focus();});
  if(id==='looks')renderLookTiles();
}
TABS.forEach((t,i)=>{
  $('tab-'+t).addEventListener('click',()=>showTab(t));
  $('tab-'+t).addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();showTab(TABS[(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length],true);}});
});

/* ---------- loading ---------- */
const busy=(msg)=>{$('busy').hidden=!msg;$('busy').textContent=msg||'';};
async function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic|heif|avif)$/i.test(f.name));
  if(!files.length){toast('Those files are not photos. Choose JPG, PNG, WEBP or HEIC.');return;}
  const from=linked.checked?ph():null,added=[],failed=[];
  setBusy(true);
  for(let i=0;i<files.length;i++){
    const f=files[i];busy(`Opening ${i+1} of ${files.length}…`);
    await new Promise(r=>setTimeout(r,16));
    try{const bmp=await createImageBitmap(f);added.push(newPhoto(f.name,f,bmp,bmp.width,bmp.height,false,from));bmp.close();}
    catch{failed.push(f.name);}
  }
  busy('');setBusy(false);
  if(added.length){photos=photos.filter(q=>!q.sample);const at=photos.length;photos.push(...added);select(at);}
  if(failed.length)toast(`Couldn't open ${failed.join(', ')}. Export ${failed.length>1?'them':'it'} as JPG and try again.`,6000);
  else toast(`Added ${added.length} photo${added.length>1?'s':''}`);
}
$('addBtn').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});
let dragDepth=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragDepth++;$('drop').hidden=false;}});
addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;$('drop').hidden=true;}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('drop').hidden=true;addFiles(e.dataTransfer.files);});

$('reset').addEventListener('click',()=>{mutate(p=>{p.adj={};p.strength=100;});syncSliders();schedule();refreshStrip();toast('Adjustments reset');});
linked.addEventListener('change',()=>{if(linked.checked){const s=ph();photos.forEach(q=>{q.look=s.look;q.strength=s.strength;q.adj={...s.adj};});refreshStrip();toast('Every photo now uses this edit');}});

/* ---------- saving ---------- */
let toastT=0;
function toast(msg,ms=3000){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.hidden=true,ms);}
async function exportBlob(q){
  let src,w,h,bmp=null;
  if(q.sample){src=SAMPLE;w=1500;h=1000;}else{bmp=await createImageBitmap(q.file);src=bmp;w=bmp.width;h=bmp.height;}
  [w,h]=fit(w,h,8000);
  const d=prep(src,w,h);if(bmp)bmp.close();
  const c=document.createElement('canvas');paint(c,d,eff(q));
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.92));
}
const outName=q=>q.name.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_')+(q.look==='original'?'-edit':'-'+q.look)+'.jpg';
function setBusy(on){['saveOne','saveAll','addBtn'].forEach(id=>$(id).disabled=on);}
/* The share sheet needs a fresh tap, and a full-size export can take seconds, so saving happens from this dialog after the files are ready. */
let readyItems=[],readyUrls=[];
const isPhone=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const toFiles=items=>items.map(([n,b])=>new File([b],n,{type:'image/jpeg'}));
const canShare=items=>isPhone&&!!navigator.canShare&&navigator.canShare({files:toFiles(items)});
function showReady(items){
  readyUrls.forEach(u=>URL.revokeObjectURL(u));readyItems=items;readyUrls=[];
  const o=$('outs');o.innerHTML='';
  items.forEach(([name,blob])=>{const u=URL.createObjectURL(blob);readyUrls.push(u);const im=new Image();im.src=u;im.alt=name;o.appendChild(im);});
  const n=items.length,share=canShare(items);
  $('readyTitle').textContent=n>1?`${n} photos ready`:'Your photo is ready';
  $('readyNote').textContent=share?'Tap Save to Photos, then choose Save Image. You can also long-press a photo to save it.'
    :n>1?'They download as one zip file.':'It downloads as a full-size JPG.';
  $('readySave').textContent=share?(n>1?`Save ${n} to Photos`:'Save to Photos'):(n>1?'Download zip':'Download');
  $('ready').showModal();
}
function download(name,blob){
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function zipDownload(items){
  if(!window.JSZip){items.forEach(([n,b])=>download(n,b));return;}
  const z=new JSZip(),used={};
  items.forEach(([n,b])=>{let nm=n;while(used[nm])nm=nm.replace(/(\.jpg)$/,'-1$1');used[nm]=1;z.file(nm,b);});
  download('look-lab-photos.zip',await z.generateAsync({type:'blob'}));
}
/* Opens the share sheet while the tap still counts; if the browser says the tap expired, the ready dialog asks for one more tap. */
async function deliver(items){
  if(canShare(items)){
    try{await navigator.share({files:toFiles(items)});$('ready').close();toast('Saved');}
    catch(e){
      if(e.name==='NotAllowedError'&&!$('ready').open)showReady(items);
      else if(e.name!=='AbortError')toast('Sharing failed. Long-press a photo to save it instead.',6000);
    }
    return;
  }
  if(items.length===1){download(...items[0]);$('ready').close();toast('Downloaded');return;}
  try{await zipDownload(items);$('ready').close();toast('Downloaded');}
  catch{toast('Packing the zip failed. Try fewer photos at once.',6000);}
}
$('readySave').addEventListener('click',()=>deliver(readyItems));

/* Full-size renders happen ahead of time in a worker, so Save can open the share sheet instantly. */
const cache=new Map(),inflight=new Map(),waits=new Map();
let worker=null,wid=0;
try{
  if(typeof OffscreenCanvas!=='undefined'&&'convertToBlob' in OffscreenCanvas.prototype){
    const src=[
      `const N=${N},LINMAX=${LINMAX};const s2l=${s2l};const l2s=${l2s};`,
      `const TOLIN=new Float32Array(256);for(let i=0;i<256;i++)TOLIN[i]=s2l(i/255);`,
      `const LINS=new Float32Array(N);for(let i=0;i<N;i++)LINS[i]=l2s(i/(N-1)*LINMAX);`,
      `const fit=${fit};const makeCanvas=${makeCanvas};`,
      ...[toneLUT,tintVec,bw,render,blurPass,prep].map(String),
      `onmessage=async e=>{const{id,src,p}=e.data;try{const bmp=src instanceof Blob?await createImageBitmap(src):src;const[w,h]=fit(bmp.width,bmp.height,8000);const d=prep(bmp,w,h);if(bmp.close)bmp.close();const c=new OffscreenCanvas(w,h);const img=new ImageData(w,h);render(d,p,img.data);c.getContext('2d').putImageData(img,0,0);postMessage({id,blob:await c.convertToBlob({type:'image/jpeg',quality:.92})});}catch(err){postMessage({id,error:String(err)});}};`
    ].join('\n');
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=e=>{const w=waits.get(e.data.id);if(!w)return;waits.delete(e.data.id);e.data.error?w.rej(new Error(e.data.error)):w.res(e.data.blob);};
    worker.onerror=()=>{worker=null;waits.forEach(w=>w.rej(new Error('worker')));waits.clear();};
  }
}catch{worker=null;}
async function workerBlob(q,p){
  const id=++wid;let src=q.file,tr=[];
  if(q.sample){src=await createImageBitmap(SAMPLE);tr=[src];}
  return new Promise((res,rej)=>{waits.set(id,{res,rej});worker.postMessage({id,src,p},tr);});
}
const keyOf=q=>q.id+'|'+JSON.stringify(eff(q));
const isReady=q=>cache.get(q.id)?.key===keyOf(q);
function getBlob(q){
  const key=keyOf(q),c=cache.get(q.id);
  if(c&&c.key===key)return Promise.resolve(c.blob);
  if(inflight.has(key))return inflight.get(key);
  const pr=(worker?workerBlob(q,eff(q)).catch(()=>{worker=null;return exportBlob(q);}):exportBlob(q))
    .then(b=>{cache.set(q.id,{key,blob:b});inflight.delete(key);return b;},e=>{inflight.delete(key);throw e;});
  inflight.set(key,pr);return pr;
}
let prefT=0,prefGen=0;
function prefetch(){
  clearTimeout(prefT);if(!worker)return;
  prefT=setTimeout(async()=>{
    const gen=++prefGen,c=ph(),order=[c,...photos.filter(q=>q!==c&&!q.sample)];
    for(const q of order){if(gen!==prefGen||!photos.includes(q))return;try{await getBlob(q);}catch{}}
  },800);
}
$('readyClose').addEventListener('click',()=>$('ready').close());
$('saveOne').addEventListener('click',async()=>{
  const q=ph();
  if(!isReady(q)){setBusy(true);busy('Preparing full-size photo…');if(!worker)await new Promise(r=>setTimeout(r,30));}
  try{const blob=await getBlob(q);busy('');await deliver([[outName(q),blob]]);}
  catch{toast('Saving failed. The photo may be too large for this device. Try again.',6000);}
  finally{busy('');setBusy(false);}
});
$('saveAll').addEventListener('click',async()=>{
  const list=photos.filter(q=>!q.sample),items=[];
  const allReady=list.every(isReady);if(!allReady)setBusy(true);
  try{
    for(let i=0;i<list.length;i++){
      if(!isReady(list[i])){busy(`Preparing ${i+1} of ${list.length}…`);if(!worker)await new Promise(r=>setTimeout(r,30));}
      items.push([outName(list[i]),await getBlob(list[i])]);
    }
    busy('');await deliver(items);
  }catch{toast('Saving failed partway. Try saving fewer photos at once.',6000);}
  finally{busy('');setBusy(false);}
});

/* ---------- boot ---------- */
const SAMPLE=makeSample();
buildSliders();buildLooks();
photos.push(newPhoto('Sample beach',null,SAMPLE,1500,1000,true));
photos[0].look='teal';
select(0);
</script>
